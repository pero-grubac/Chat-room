services:
  # ─── Certificate Controller: internal CA for every TLS connection ─────────────
  # Runs once per start: creates the CA, issues missing certificates, refreshes the CRL.
  # Manage certificates with: docker compose run --rm certificates list | issue <c> | revoke <c>
  certificates:
    image: chatroom-certificates:local
    build:
      context: ./certificates
    container_name: chatroom-certificates
    volumes:
      - pki_ca:/ca # the CA's private key never leaves this volume
      - pki:/pki

  # ─── MySQL database (TLS required) ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: chatroom-mysql
    restart: unless-stopped
    command:
      - --ssl-ca=/pki/ca.crt
      - --ssl-cert=/pki/mysql.crt
      - --ssl-key=/pki/mysql.key
      - --require-secure-transport=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "127.0.0.1:3306:3306"
    # The schema and seed data come from Flyway migrations when the backend starts
    volumes:
      - mysql_data:/var/lib/mysql
      - type: volume
        source: pki
        target: /pki
        read_only: true
        volume:
          subpath: mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      certificates:
        condition: service_completed_successfully

  # ─── Spring Boot backend ───────────────────────────────────────────────────
  backend:
    image: chatroom-backend:local
    build:
      context: ./ChatRoom
      dockerfile: Dockerfile
    container_name: chatroom-backend
    restart: unless-stopped
    # Direct API access, from this machine only; everyone else goes through Nginx
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      # TLS to MySQL, verifying both the CA and the host name
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/pki/truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      TOKEN_SIGNING_KEY: ${JWT_SIGNING_KEY}
      SPRING_MAIL_HOST: ${MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FRONTEND_URL: https://localhost
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
      AUTH_COOKIE_SECURE: "true"
    volumes:
      - type: volume
        source: pki
        target: /pki
        read_only: true
        volume:
          subpath: backend
      # Application and SIEM logs (security.log) survive restarts
      - backend_logs:/app/logs
    depends_on:
      certificates:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ─── Mailpit: catches outgoing email (2FA codes) for local use ─────────────
  # Inbox at http://localhost:8025. Set MAIL_HOST/MAIL_PORT in .env to send through Gmail instead.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: chatroom-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025" # web inbox
      - "127.0.0.1:2525:1025" # SMTP, for a backend started outside Docker

  # ─── React frontend + Nginx TLS proxy ─────────────────────────────────────
  frontend:
    image: chatroom-frontend:local
    build:
      context: ./ChatRoom - Frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: chatroom-frontend
    restart: unless-stopped
    ports:
      - "80:80" # HTTP → redirect to HTTPS
      - "443:443" # HTTPS → React SPA + proxy to backend
    volumes:
      - type: volume
        source: pki
        target: /etc/nginx/certs
        read_only: true
        volume:
          subpath: nginx
    depends_on:
      certificates:
        condition: service_completed_successfully
      backend:
        condition: service_started

volumes:
  mysql_data:
    name: chatroom_mysql_data
  pki_ca:
    name: chatroom_pki_ca
  pki:
    name: chatroom_pki
  backend_logs:
    name: chatroom_backend_logs
