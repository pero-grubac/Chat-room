spring.application.name=ChatRoom
spring.datasource.url=jdbc:mysql://localhost:3306/chatroom
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
#spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Schema migrations (src/main/resources/db/migration). A database created by the old ddl.sql
# is adopted as version 1, then the later migrations run on top of it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.placeholders.adminEmail=${ADMIN_EMAIL:admin@gmail.com}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT: Base64 HS256 key and session length
token.signing.key=
token.expiration=PT24H
# Session cookie (httpOnly, SameSite=Strict). Set AUTH_COOKIE_SECURE=false only for plain-HTTP local development.
auth.cookie.name=CHATROOM_SESSION
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
# One-time sign-in codes
two-factor.expiration=PT5M
# Requests per client IP to /auth/** within the window
rate-limit.auth.requests=10
rate-limit.auth.window=PT1M

# Google OAuth2 client the web app signs in with; access tokens issued to any other client are refused
google.client-id=${GOOGLE_CLIENT_ID:}
server.port=8443
# TLS with the certificate issued by the Certificate Controller (PEM files mounted at /pki)
server.ssl.enabled=true
server.ssl.certificate=${SSL_CERTIFICATE:file:/pki/backend.crt}
server.ssl.certificate-private-key=${SSL_CERTIFICATE_PRIVATE_KEY:file:/pki/backend.key}
# Trust X-Forwarded-For from Nginx (internal addresses), so rate limits see the real client
server.forward-headers-strategy=native
frontend.url=https://localhost
