# Test configuration: replaces src/main/resources/application.properties on the test classpath.
# Uses an in-memory H2 database in MySQL mode, so tests need neither MySQL nor Docker.
spring.application.name=ChatRoom-test

spring.datasource.url=jdbc:h2:mem:chatroom;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.mail.host=localhost
spring.mail.port=2525

# Base64, 48 bytes (HS256 needs at least 32)
token.signing.key=dGVzdC1zaWduaW5nLWtleS1mb3ItY2hhdHJvb20tdW5pdC10ZXN0cy0xMjM0NTY3OA==

google.client-id=test-client-id

server.ssl.enabled=false
frontend.url=http://localhost:3000

# Hibernate creates the H2 schema; the Flyway migrations are MySQL-specific and run in the Docker smoke test
spring.flyway.enabled=false
spring.jpa.open-in-view=false

token.expiration=PT24H
two-factor.expiration=PT5M
auth.cookie.name=CHATROOM_SESSION
auth.cookie.secure=true
# High enough for the whole suite; AuthRateLimitFilterTest covers the limit itself
rate-limit.auth.requests=1000
rate-limit.auth.window=PT1M
