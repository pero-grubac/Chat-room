server {
    listen 80;
    server_name localhost;
    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # Issued by the Certificate Controller (certificates/)
    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The API lives under /api; the prefix is stripped, so Spring keeps its own paths.
    # Keeping it separate means SPA routes such as /users always load the app on refresh.
    # The backend's certificate must be signed by our CA, carry the name "backend" and not be revoked.
    location /api/ {
        proxy_pass                    https://backend:8443/;
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        2;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_crl                 /etc/nginx/certs/crl.pem;
        proxy_ssl_name                backend;
        proxy_ssl_protocols           TLSv1.2 TLSv1.3;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Overwrite, not append: the client cannot inject its own address for the rate limit
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so browsers may cache them for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # React Router – SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
